<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Party Guesser - VIP Edition</title>
    <style>
        :root {
            --primary: #f2c94c;
            --secondary: #f2994a;
            --bg-dark: #0f1115;
            --bg-card: rgba(30, 34, 45, 0.65);
            --text-main: #f8f9fa;
            --text-muted: #a0aab2;
            --success: #4CAF50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 50% 0%, #232732 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(242, 201, 76, 0.15);
            letter-spacing: 1px;
        }

        /* حاوية اللعبة بتصميم احترافي (Glassmorphism) */
        .game-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            padding: 12px;
            transition: transform 0.3s ease;
        }

        .game-container:hover {
            transform: translateY(-5px);
        }

        .image-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            background-color: #1a1a24;
        }

        .game-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }

        .game-container:hover .game-image {
            opacity: 1;
        }

        /* تنسيق علامة الصح ✅ بشكل جميل ومضيء */
        .marker {
            position: absolute;
            font-size: 42px;
            transform: translate(-50%, -50%);
            display: none;
            filter: drop-shadow(0px 5px 12px rgba(0, 0, 0, 0.9));
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 25px rgba(76, 175, 80, 0.9);
        }

        /* زر التخمين الاحترافي */
        .guess-btn {
            margin-top: 40px;
            padding: 16px 65px;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #111;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(242, 201, 76, 0.25);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .guess-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(242, 201, 76, 0.4);
        }

        .guess-btn:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 5px 15px rgba(242, 201, 76, 0.3);
        }

        /* نص النتيجة */
        .result-text {
            margin-top: 30px;
            font-size: 19px;
            color: var(--text-muted);
            font-weight: 600;
            min-height: 30px;
            line-height: 1.5;
            padding: 12px 25px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            letter-spacing: 0.5px;
        }

        .result-text.active {
            color: var(--success);
            background: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.25);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.1);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h2>تخمين اللعبة الفائزة VIP</h2>

    <div class="game-container">
        <div class="image-wrapper">
            <!-- تأكد من وجود ملف الصورة في نفس المجلد -->
            <img src="vipvip.jpg" alt="Fruit Party" class="game-image">
            
            <!-- 4 علامات صح للـ 4 خانات -->
            <div id="marker-1" class="marker">✅</div>
            <div id="marker-2" class="marker">✅</div>
            <div id="marker-3" class="marker">✅</div>
            <div id="marker-4" class="marker">✅</div>
        </div>
    </div>

    <button class="guess-btn" onclick="makeGuess()">تخمين الآن</button>
    <div class="result-text" id="result-text">اضغط على الزر لبدء التخمين</div>

    <script>
        // إحداثيات دقيقة لشبكة 3x3 (تمت إزالة أسماء الفواكه كما طلبت)
        const slots = [
            { id: 1, top: '17%', left: '17%' },
            { id: 2, top: '17%', left: '50%' },
            { id: 3, top: '17%', left: '83%' },
            { id: 4, top: '50%', left: '17%' },
            // المركز مستبعد
            { id: 5, top: '50%', left: '83%' },
            { id: 6, top: '83%', left: '17%' },
            { id: 7, top: '83%', left: '50%' },
            { id: 8, top: '83%', left: '83%' }
        ];

        let previousSelection = [];

        // دالة لخلط المصفوفة بشكل عشوائي
        function shuffleArray(array) {
            let newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function makeGuess() {
            let selectedSlots = [];

            if (previousSelection.length === 0) {
                // الجولة الأولى
                selectedSlots = shuffleArray(slots).slice(0, 4);
            } else {
                // الجولات التالية: نفس اللوجيك السابق لضمان التنوع
                let notPickedLastTime = slots.filter(s => !previousSelection.includes(s.id));
                let pickedLastTime = slots.filter(s => previousSelection.includes(s.id));
                
                notPickedLastTime = shuffleArray(notPickedLastTime);
                pickedLastTime = shuffleArray(pickedLastTime);
                
                selectedSlots = notPickedLastTime.slice(0, 3).concat(pickedLastTime.slice(0, 1));
                selectedSlots = shuffleArray(selectedSlots);
            }

            // تحديث الذاكرة
            previousSelection = selectedSlots.map(s => s.id);

            // تحريك وعرض الـ 4 علامات
            selectedSlots.forEach((slot, index) => {
                let marker = document.getElementById('marker-' + (index + 1));
                marker.style.top = slot.top;
                marker.style.left = slot.left;
                marker.style.display = 'block';

                // إضافة تأثير الحركة الاحترافي عند التحديث
                marker.style.transform = 'translate(-50%, -50%) scale(1.8)';
                setTimeout(() => {
                    marker.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 250);
            });

            // إخفاء أسماء الفواكه والاكتفاء برسالة تأكيد أنيقة
            const resultBox = document.getElementById('result-text');
            resultBox.innerText = "🎯 تم تحديد المواقع المتوقعة بنجاح!";
            
            // إضافة كلاس التفعيل للحصول على تأثير لوني
            resultBox.classList.remove('active');
            // تأخير بسيط لإعادة تشغيل الـ animation
            setTimeout(() => {
                resultBox.classList.add('active');
            }, 50);
        }
    </script>
</body>
</html>
