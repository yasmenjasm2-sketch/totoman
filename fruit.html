<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Party Guesser</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* حاوية الصورة لتحديد الإحداثيات بدقة */
        .game-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            background: #1f2833;
        }

        .game-image {
            display: block;
            width: 100%;
            height: auto;
        }

        /* تنسيق علامة الصح ✅ */
        .marker {
            position: absolute;
            font-size: 45px;
            /* توسيط العلامة بالضبط على النقطة المطلوبة */
            transform: translate(-50%, -50%);
            display: none;
            filter: drop-shadow(0px 0px 8px rgba(0, 0, 0, 1));
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* زر التخمين */
        .guess-btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff9800, #ffeb3b);
            color: #111;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .guess-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
        }

        .result-text {
            margin-top: 20px;
            font-size: 18px;
            color: #45a29e;
            font-weight: bold;
            min-height: 30px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h2>تخمين اللعبة الفائزة (4 خانات)</h2>

    <div class="game-container">
        <!-- تأكد من وجود ملف الصورة في نفس المجلد -->
        <img src="vipvip.jpg" alt="Fruit Party" class="game-image">
        
        <!-- 4 علامات صح للـ 4 خانات -->
        <div id="marker-1" class="marker">✅</div>
        <div id="marker-2" class="marker">✅</div>
        <div id="marker-3" class="marker">✅</div>
        <div id="marker-4" class="marker">✅</div>
    </div>

    <button class="guess-btn" onclick="makeGuess()">تخمين الآن</button>
    <div class="result-text" id="result-text">اضغط على الزر لبدء التخمين</div>

    <script>
        // إحداثيات دقيقة لشبكة 3x3 بناءً على مراكز المربعات
        const fruits = [
            { id: 1, name: 'الليمون', top: '17%', left: '17%' },
            { id: 2, name: 'التوت', top: '17%', left: '50%' },
            { id: 3, name: 'الكيوي', top: '17%', left: '83%' },
            { id: 4, name: 'الكرز', top: '50%', left: '17%' },
            // تم استبعاد المركز (50%, 50%) لأنه يحتوي على المؤقت (00)
            { id: 5, name: 'البرقوق', top: '50%', left: '83%' },
            { id: 6, name: 'البطيخ', top: '83%', left: '17%' },
            { id: 7, name: 'الموز', top: '83%', left: '50%' },
            { id: 8, name: 'الفراولة', top: '83%', left: '83%' }
        ];

        let previousSelection = [];

        // دالة لخلط المصفوفة بشكل عشوائي
        function shuffleArray(array) {
            let newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function makeGuess() {
            let selectedFruits = [];

            if (previousSelection.length === 0) {
                // الجولة الأولى: اختيار 4 فواكه عشوائية بالكامل
                selectedFruits = shuffleArray(fruits).slice(0, 4);
            } else {
                // الجولات التالية: ضمان تنوع عالي وعدم تطابق مع الجولة السابقة
                // نأخذ 3 فواكه لم تظهر في الجولة السابقة، وفاكهة واحدة فقط من الجولة السابقة
                let notPickedLastTime = fruits.filter(f => !previousSelection.includes(f.id));
                let pickedLastTime = fruits.filter(f => previousSelection.includes(f.id));
                
                notPickedLastTime = shuffleArray(notPickedLastTime);
                pickedLastTime = shuffleArray(pickedLastTime);
                
                selectedFruits = notPickedLastTime.slice(0, 3).concat(pickedLastTime.slice(0, 1));
                selectedFruits = shuffleArray(selectedFruits); // خلط النتيجة النهائية
            }

            // تحديث الذاكرة للجولة القادمة
            previousSelection = selectedFruits.map(f => f.id);

            let names = [];

            // تحريك وعرض الـ 4 علامات
            selectedFruits.forEach((fruit, index) => {
                let marker = document.getElementById('marker-' + (index + 1));
                marker.style.top = fruit.top;
                marker.style.left = fruit.left;
                marker.style.display = 'block';

                // إضافة تأثير الحركة عند التحديث
                marker.style.transform = 'translate(-50%, -50%) scale(1.5)';
                setTimeout(() => {
                    marker.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 200);

                names.push(fruit.name);
            });

            // تحديث النص ليعرض الـ 4 نتائج
            document.getElementById('result-text').innerText = `النتيجة المتوقعة:\n ${names.join('  -  ')}`;
        }
    </script>

</body>
</html>
