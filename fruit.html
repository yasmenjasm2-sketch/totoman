<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Party Guesser - VIP Edition</title>
    
    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #FFD700; /* لون ذهبي ملكي */
            --secondary: #FF8C00; /* برتقالي عميق */
            --bg-dark: #090a0f; /* خلفية داكنة احترافية */
            --bg-card: rgba(20, 24, 34, 0.75);
            --text-main: #f8f9fa;
            --text-muted: #b0bac3;
            --success: #4CAF50;
            --error: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1c202a 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h2 {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 20px rgba(255, 215, 0, 0.2);
            letter-spacing: 1.5px;
        }

        /* شاشة تسجيل الدخول */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }

        .login-input {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .login-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        .login-msg {
            margin-top: 15px;
            font-size: 14px;
            color: var(--error);
            font-weight: bold;
            min-height: 20px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        /* حاوية اللعبة */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .game-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1.5px rgba(255, 215, 0, 0.15);
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            padding: 14px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .game-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 1.5px rgba(255, 215, 0, 0.3);
        }

        .image-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.7);
            background-color: #12141a;
        }

        .game-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 14px;
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }

        .game-container:hover .game-image {
            opacity: 1;
        }

        /* تعديل حجم علامة الصح لتكون أصغر وأكثر احترافية */
        .marker {
            position: absolute;
            font-size: 26px; /* الحجم الجديد المصغر */
            transform: translate(-50%, -50%);
            display: none;
            filter: drop-shadow(0px 3px 8px rgba(0, 0, 0, 0.9));
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.9);
        }

        .btn {
            margin-top: 25px;
            padding: 18px 65px;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
            max-width: 320px;
        }

        .btn:hover:not(.disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 140, 0, 0.5);
        }

        .btn:active:not(.disabled) {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
        }

        .btn.disabled {
            background: linear-gradient(135deg, #444, #333);
            color: #888;
            cursor: not-allowed;
            box-shadow: inset 0 3px 10px rgba(0,0,0,0.5);
            transform: none;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .result-text {
            margin-top: 25px;
            font-size: 19px;
            color: var(--text-muted);
            font-weight: 600;
            min-height: 30px;
            line-height: 1.5;
            padding: 12px 25px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            letter-spacing: 0.5px;
        }

        .result-text.active {
            color: var(--success);
            background: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.25);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.15);
            transform: scale(1.05);
        }
        
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.05);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        /* ستايل عداد اللاعبين المتصلين */
        .online-stats {
            margin-top: 35px;
            padding: 10px 22px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }

        .online-numbers {
            direction: ltr; /* لضمان ظهور الأرقام بشكل صحيح */
            display: inline-block;
        }

        .current-players {
            color: var(--primary);
            font-weight: 800;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
            transition: color 0.3s;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 7px rgba(76, 175, 80, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <h2>تسجيل الدخول VIP</h2>
        <input type="text" id="sub-code" class="login-input" placeholder="أدخل كود الاشتراك هنا">
        <button class="btn" onclick="login()">تفعيل الدخول</button>
        <div class="loader" id="login-loader"></div>
        <p id="login-msg" class="login-msg"></p>
    </div>

    <!-- شاشة اللعبة -->
    <div id="game-screen">
        <h2>تخمين اللعبة الفائزة VIP</h2>

        <div class="game-container">
            <div class="image-wrapper">
                <img src="vipvip.jpg" alt="Fruit Party" class="game-image">
                
                <div id="marker-1" class="marker">✅</div>
                <div id="marker-2" class="marker">✅</div>
                <div id="marker-3" class="marker">✅</div>
                <div id="marker-4" class="marker">✅</div>
            </div>
        </div>

        <button id="guess-btn" class="btn" onclick="makeGuess()">تخمين الآن</button>
        <div class="result-text" id="result-text">اضغط على الزر لبدء التخمين</div>

        <!-- عداد اللاعبين المتصلين -->
        <div class="online-stats">
            <div class="pulse-dot"></div>
            <span>المتصلين الآن:</span>
            <span class="online-numbers">
                <span id="online-count" class="current-players">1432</span> / 5430
            </span>
        </div>
    </div>

    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAo4IaLd5SfVYHAAp_noJD7ZXBbhdVx9-0",
            databaseURL: "https://fawakihyallalive-default-rtdb.firebaseio.com",
            projectId: "fawakihyallalive",
            storageBucket: "fawakihyallalive.firebasestorage.app",
            appId: "1:917478913649:android:fee5d42aca81c8a2e3cdd0"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // الأكواد المسموحة
        const allowedCodes = ["hamzagmail34567", "nbras.vip23"];

        // التحقق من حالة تسجيل الدخول عند تحميل الصفحة
        window.onload = function() {
            if (localStorage.getItem('is_vip_logged_in') === 'true') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                startOnlinePlayersSimulator();
            }
        };

        function getDeviceId() {
            let id = localStorage.getItem('unique_device_id');
            if (!id) {
                id = 'device_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                localStorage.setItem('unique_device_id', id);
            }
            return id;
        }

        function encryptCode(code) {
            return btoa(code); 
        }

        function login() {
            const codeInput = document.getElementById('sub-code').value.trim();
            const msgBox = document.getElementById('login-msg');
            const loader = document.getElementById('login-loader');
            
            msgBox.innerText = "";
            
            if (!codeInput) {
                msgBox.innerText = "الرجاء إدخال كود الاشتراك.";
                return;
            }

            if (!allowedCodes.includes(codeInput)) {
                msgBox.innerText = "كود الاشتراك غير صالح أو منتهي الصلاحية.";
                return;
            }

            loader.style.display = "block";
            const deviceId = getDeviceId();
            const encryptedCode = encryptCode(codeInput);
            const dbRef = db.ref('subscriptions_vip/' + encryptedCode);

            dbRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                
                if (data && data.deviceId) {
                    if (data.deviceId === deviceId) {
                        startGameScreen();
                    } else {
                        loader.style.display = "none";
                        msgBox.innerText = "❌ هذا الكود مرتبط بجهاز آخر بالفعل، لا يمكن استخدامه هنا.";
                    }
                } else {
                    dbRef.set({
                        deviceId: deviceId,
                        activationDate: new Date().toISOString(),
                        originalCode: codeInput
                    }).then(() => {
                        startGameScreen();
                    }).catch(error => {
                        loader.style.display = "none";
                        msgBox.innerText = "حدث خطأ أثناء الاتصال بالخادم.";
                    });
                }
            }).catch(error => {
                loader.style.display = "none";
                msgBox.innerText = "خطأ في الشبكة، تحقق من اتصالك بالإنترنت.";
            });
        }

        function startGameScreen() {
            localStorage.setItem('is_vip_logged_in', 'true'); // إضافة حفظ حالة الدخول
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            startOnlinePlayersSimulator(); // بدء المحاكي الوهمي بعد الدخول
        }

        // ----------------- منطق اللعبة ----------------- //

        const slots = [
            { id: 1, top: '17%', left: '17%' },
            { id: 2, top: '17%', left: '50%' },
            { id: 3, top: '17%', left: '83%' },
            { id: 4, top: '50%', left: '17%' },
            { id: 5, top: '50%', left: '83%' },
            { id: 6, top: '83%', left: '17%' },
            { id: 7, top: '83%', left: '50%' },
            { id: 8, top: '83%', left: '83%' }
        ];

        let previousSelection = [];
        let isGuessingAllowed = true;
        let countdownTimer;

        function shuffleArray(array) {
            let newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function makeGuess() {
            if (!isGuessingAllowed) return;

            let selectedSlots = [];

            if (previousSelection.length === 0) {
                selectedSlots = shuffleArray(slots).slice(0, 4);
            } else {
                let notPickedLastTime = slots.filter(s => !previousSelection.includes(s.id));
                let pickedLastTime = slots.filter(s => previousSelection.includes(s.id));
                
                notPickedLastTime = shuffleArray(notPickedLastTime);
                pickedLastTime = shuffleArray(pickedLastTime);
                
                selectedSlots = notPickedLastTime.slice(0, 3).concat(pickedLastTime.slice(0, 1));
                selectedSlots = shuffleArray(selectedSlots);
            }

            previousSelection = selectedSlots.map(s => s.id);

            selectedSlots.forEach((slot, index) => {
                let marker = document.getElementById('marker-' + (index + 1));
                marker.style.top = slot.top;
                marker.style.left = slot.left;
                marker.style.display = 'block';

                marker.style.transform = 'translate(-50%, -50%) scale(1.6)';
                setTimeout(() => {
                    marker.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 250);
            });

            const resultBox = document.getElementById('result-text');
            resultBox.innerText = "🎯 تم تحديد المواقع المتوقعة بنجاح!";
            
            resultBox.classList.remove('active');
            setTimeout(() => {
                resultBox.classList.add('active');
            }, 50);

            // تشغيل عداد الـ 35 ثانية
            startCooldown();
        }

        function startCooldown() {
            isGuessingAllowed = false;
            let timeLeft = 35; // تم التعديل إلى 35 ثانية
            const btn = document.getElementById('guess-btn');
            
            btn.classList.add('disabled');
            btn.innerText = `الرجاء الانتظار (${timeLeft}) ثانية`;

            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    btn.innerText = `الرجاء الانتظار (${timeLeft}) ثانية`;
                } else {
                    clearInterval(countdownTimer);
                    isGuessingAllowed = true;
                    btn.classList.remove('disabled');
                    btn.innerText = "تخمين الآن";
                }
            }, 1000);
        }

        // محاكي المتصلين الوهمي الاحترافي
        function startOnlinePlayersSimulator() {
            let currentPlayers = 1432;
            const counterElement = document.getElementById('online-count');
            
            setInterval(() => {
                // إضافة أو طرح رقم عشوائي بين -3 و +6 لتبدو الحركة حقيقية
                const fluctuation = Math.floor(Math.random() * 10) - 3;
                currentPlayers += fluctuation;
                
                // الحفاظ على الرقم ضمن نطاق واقعي
                if (currentPlayers < 1350) currentPlayers += 25;
                if (currentPlayers > 1580) currentPlayers -= 25;
                
                counterElement.innerText = currentPlayers;
                
            }, 3000); // يتحدث الرقم كل 3 ثوانٍ تقريباً
        }
    </script>
</body>
</html>
